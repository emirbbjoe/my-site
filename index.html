<style>
/* Layout: one centered column of glass pills on a live canvas. Title, clock pill, icon bubbles, ID card made of pill rows, terminal pill. */
:root {
  --bg: #000000;
  --fg: #e3e7ee;
  --soft: #aab2be;
  --muted: #747d8a;
  --line: rgba(255, 255, 255, .09);
  --accent: rgb(225, 228, 234);
  --accent-rgb: 225, 228, 234;
  --g-rgb: 220, 224, 230;
  --danger: #ff7a8a;
  --pill: linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .015)), rgba(12, 14, 18, .72);
  --lift: inset 0 1px 0 rgba(255, 255, 255, .06), 0 10px 30px -12px rgba(0, 0, 0, .8);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --display: 'Syne', 'Arial Black', Impact, system-ui, sans-serif;
  --mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  overflow-x: hidden;
}
::selection { background: rgba(var(--accent-rgb), .3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

#bg { position: fixed; inset: 0; z-index: 0; display: block; }
.glow {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(560px circle at var(--mx, 50%) var(--my, 40%), rgba(var(--g-rgb), .05), transparent 65%),
    radial-gradient(ellipse at 50% 42%, transparent 25%, rgba(0, 0, 0, .9) 100%);
}

.stage {
  position: relative; z-index: 2;
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center;
  padding-inline: 16px; padding-block: 40px 20px;
  text-align: center;
}
.center {
  margin-block: auto;
  width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 22px;
}

/* the pill, used everywhere */
.pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  max-width: 100%;
  padding: 10px 20px;
  border-radius: 999px;
  background: var(--pill);
  border: 1px solid var(--line);
  box-shadow: var(--lift);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  color: var(--fg);
  font-size: 12px; letter-spacing: .16em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pill.sm { padding: 6px 14px; font-size: 11px; letter-spacing: .12em; }
button.pill { font-family: inherit; cursor: pointer; transition: transform .35s var(--spring), border-color .2s, box-shadow .2s, color .2s; }
button.pill:hover { transform: translateY(-2px) scale(1.03); }
button.pill:active { transform: scale(.96); }
.sl { color: var(--muted); opacity: .75; }
.dot {
  flex: none;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .16), 0 0 12px rgba(var(--accent-rgb), .9);
  animation: beat 2.4s ease-in-out infinite;
}
@keyframes beat { 50% { opacity: .35; } }

.title {
  margin: 0 0 2px;
  max-width: 100%;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(1.8rem, 6.8vw, 4.8rem);
  line-height: 1.05;
  letter-spacing: .02em;
  color: #fff;
  overflow-wrap: anywhere;
  text-wrap: balance;
  text-shadow: 0 0 40px rgba(255, 255, 255, .2);
  cursor: default;
}

.meta { color: var(--fg); }
.meta .c { color: var(--soft); }

/* social bubbles */
.socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.bubble {
  position: relative;
  display: grid; place-items: center;
  width: 48px; height: 48px; padding: 0;
  border-radius: 50%;
  background: var(--pill);
  border: 1px solid var(--line);
  box-shadow: var(--lift);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  color: var(--soft);
  text-decoration: none; font: inherit; cursor: pointer;
  transition: transform .35s var(--spring), color .2s, border-color .2s, box-shadow .2s;
}
.sdot {
  position: absolute; top: 1px; right: 1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: #6b7280; border: 2px solid #000;
  box-sizing: border-box; pointer-events: none;
}
.sdot[hidden] { display: none; }
.sdot.online { background: #23c55e; box-shadow: 0 0 8px rgba(35,197,94,.8); }
.sdot.idle { background: #f5b301; }
.sdot.dnd { background: #ef4444; }
.bubble svg {
  width: 21px; height: 21px;
  fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
}
.bubble svg .f { fill: currentColor; stroke: none; }
.bubble:hover, .bubble:focus-visible {
  transform: translateY(-4px) scale(1.1);
  color: var(--accent);
  border-color: rgba(var(--accent-rgb), .55);
  box-shadow: var(--lift), 0 0 26px -4px rgba(var(--accent-rgb), .6);
}
.bubble:active { transform: scale(.92); }
.bubble.done { color: var(--accent); border-color: rgba(var(--accent-rgb), .6); box-shadow: var(--lift), 0 0 28px -4px rgba(var(--accent-rgb), .7); }

/* now playing */
.np {
  width: min(440px, 100%);
  text-align: left;
  display: flex; flex-direction: column; gap: 12px;
  padding: 14px;
  background: var(--pill);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border: 1px solid var(--line); border-radius: 30px;
  box-shadow: var(--lift);
  animation: pop .5s var(--spring);
}
.np[hidden] { display: none; }
.np-row { display: flex; align-items: center; gap: 14px; min-width: 0; }
.np-art {
  flex: none; width: 72px; height: 72px;
  border-radius: 20px; overflow: hidden;
  background: radial-gradient(circle at 30% 25%, #3b3e45, #0c0d10 72%);
  border: 1px solid var(--line);
  box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .9);
}
.np-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
.np-art img:not([src]) { display: none; }
.np-meta { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.np-tag { color: var(--soft); background: rgba(255, 255, 255, .035); box-shadow: none; }
.np-title {
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--fg); text-decoration: none; font-size: 13.5px; font-weight: 500;
}
a.np-title[href]:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.np-artist { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
.np-prog { display: flex; align-items: center; gap: 10px; padding-inline: 4px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.np-prog[hidden] { display: none; }
.np-prog .bar { flex: 1; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.np-prog .bar i {
  display: block; height: 100%; width: 0; border-radius: 999px;
  background: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb), .6);
  transition: width 1s linear;
}
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 10px; }
.eq i { width: 2px; height: 40%; border-radius: 2px; background: var(--accent); animation: eq 1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.4s; }
.eq i:nth-child(3) { animation-delay: -.7s; }
@keyframes eq { 50% { height: 100%; } }

/* id card */
.card {
  position: relative;
  width: min(440px, 100%);
  text-align: left;
  background: var(--pill);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border: 1px solid var(--line); border-radius: 30px;
  box-shadow: var(--lift);
  overflow: hidden;
  transition: transform .18s ease-out, border-color .25s;
  will-change: transform;
}
.card:hover { border-color: rgba(var(--accent-rgb), .3); }
.card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(280px circle at var(--gx, 50%) var(--gy, 0%), rgba(var(--accent-rgb), .09), transparent 70%);
  opacity: 0; transition: opacity .25s;
}
.card:hover::after { opacity: 1; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 14px 10px; }
.card-h .pill { background: rgba(255, 255, 255, .035); box-shadow: none; color: var(--soft); }
.card-h .live { color: var(--accent); }
.fields { margin: 0; padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.fields > div {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  min-height: 44px; padding: 8px 20px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .035);
  border: 1px solid rgba(255, 255, 255, .06);
  transition: border-color .25s, background .25s;
}
.fields > div:hover { border-color: rgba(var(--accent-rgb), .3); background: rgba(var(--accent-rgb), .04); }
.fields dt { color: var(--muted); }
.fields dd { margin: 0; text-align: right; overflow-wrap: anywhere; }

.open { color: #fff; border-color: rgba(255, 255, 255, .28); padding: 13px 24px; }
.open:hover { box-shadow: var(--lift), 0 0 32px -8px rgba(255, 255, 255, .6); border-color: rgba(255, 255, 255, .7); }

.foot {
  width: 100%; max-width: 980px;
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px;
  color: var(--muted);
  padding-top: 24px;
}
.foot .pill { color: var(--muted); }
.foot button.pill:hover { color: var(--accent); border-color: rgba(var(--accent-rgb), .5); }
.foot b { color: var(--accent); font-weight: 400; }

/* terminal */
.term {
  position: fixed; inset: 0; margin: auto; z-index: 20;
  width: min(780px, calc(100% - 32px));
  height: min(540px, calc(100% - 96px));
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, 0)), rgba(7, 9, 12, .92);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border: 1px solid var(--line); border-radius: 28px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 40px 90px -24px rgba(0, 0, 0, .9), 0 0 60px -20px rgba(var(--accent-rgb), .35);
  translate: var(--tx, 0px) var(--ty, 0px);
  animation: pop .35s var(--spring);
}
.term[hidden] { display: none; }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(10px); } }
.term-h {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px 14px 8px 16px;
  cursor: grab; user-select: none; touch-action: none;
}
.term-h:active { cursor: grabbing; }
.term-h .pill { background: rgba(255, 255, 255, .035); box-shadow: none; color: var(--soft); }
.x {
  display: grid; place-items: center;
  width: 30px; height: 30px; padding: 0;
  font: inherit; font-size: 13px; line-height: 1; color: var(--muted);
  background: rgba(255, 255, 255, .035); border: 1px solid var(--line); border-radius: 50%;
  cursor: pointer;
  transition: transform .3s var(--spring), color .2s, border-color .2s;
}
.x:hover { color: var(--accent); border-color: rgba(var(--accent-rgb), .5); transform: scale(1.12) rotate(90deg); }
#out {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 10px 22px;
  font-size: 12.5px; line-height: 1.65;
  scrollbar-width: thin; scrollbar-color: #2a313c transparent;
}
.l { white-space: pre-wrap; overflow-wrap: anywhere; }
.l a { color: var(--accent); }
.ok { color: var(--accent); }
.dim { color: var(--muted); }
.err { color: var(--danger); }
.p { color: var(--accent); }
.term-f {
  display: flex; align-items: center; gap: 8px;
  margin: 6px 14px 14px; padding: 5px 16px 5px 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .04);
  border: 1px solid var(--line);
  transition: border-color .2s, box-shadow .2s;
}
.term-f:focus-within { border-color: rgba(var(--accent-rgb), .5); box-shadow: 0 0 24px -8px rgba(var(--accent-rgb), .6); }
.term-f label { color: var(--accent); font-size: 12px; padding: 5px 12px; border-radius: 999px; background: rgba(var(--accent-rgb), .08); white-space: nowrap; }
#in {
  flex: 1; min-width: 0;
  font: inherit; font-size: 12.5px; color: var(--fg);
  background: transparent; border: 0; outline: 0; caret-color: var(--accent);
  padding: 6px 4px;
}
/* minigame */
.game {
  position: fixed; inset: 0; margin: auto; z-index: 30;
  width: min(460px, calc(100% - 24px)); height: fit-content; max-height: calc(100% - 24px);
  display: flex; flex-direction: column; gap: 12px;
  padding: 12px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, 0)), rgba(5, 7, 10, .95);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border: 1px solid var(--line); border-radius: 28px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 40px 90px -24px rgba(0, 0, 0, .9), 0 0 60px -20px rgba(var(--accent-rgb), .3);
  touch-action: none; overscroll-behavior: contain; user-select: none;
  animation: pop .35s var(--spring);
}
.game[hidden] { display: none; }
.game-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.game-h .pill { background: rgba(255, 255, 255, .035); box-shadow: none; color: var(--soft); }
.game-h b { font-weight: 500; color: var(--fg); }
.game-h .x { margin-left: auto; }
#gCv {
  display: block; width: 100%; aspect-ratio: 1 / 1;
  max-width: max(220px, calc(100vh - 250px)); max-width: max(220px, calc(100dvh - 250px));
  margin-inline: auto;
  border-radius: 20px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, .02);
  touch-action: none; cursor: pointer;
}
.dpad { display: none; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 8px; justify-content: center; }
@media (hover: none) { .dpad { display: grid; } }
.pad {
  display: grid; place-items: center;
  width: 56px; height: 56px; padding: 0;
  font: inherit; font-size: 20px; color: var(--soft);
  background: var(--pill); border: 1px solid var(--line); border-radius: 50%;
  box-shadow: var(--lift); cursor: pointer; touch-action: none; user-select: none;
  transition: transform .2s var(--spring), color .15s, border-color .15s;
}
.pad:active { transform: scale(.9); color: var(--accent); border-color: rgba(var(--accent-rgb), .6); }
.pad[data-d="up"] { grid-column: 2; grid-row: 1; }
.pad[data-d="left"] { grid-column: 1; grid-row: 2; }
.pad[data-d="down"] { grid-column: 2; grid-row: 2; }
.pad[data-d="right"] { grid-column: 3; grid-row: 2; }
@media (max-width: 600px) {
  #in { font-size: 16px; }
  .term-f label { display: none; }
  .term-f { padding-left: 16px; }
}
@media (max-width: 600px) {
  .pill.meta { font-size: 10.5px; letter-spacing: .08em; gap: 8px; padding: 8px 16px; }
}
@media (max-width: 420px) {
  .pill.meta { font-size: 9.5px; letter-spacing: .05em; gap: 6px; padding: 7px 13px; }
  .pill.meta .dot { width: 6px; height: 6px; box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .16), 0 0 8px rgba(var(--accent-rgb), .9); }
  .fields > div { padding-inline: 16px; }
}
@media (max-width: 350px) { .meta .coord, .meta .s2 { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .dot, .term, .eq i, .np, .game { animation: none; }
  .card, .bubble, .pill, .x, .fields > div { transition: none; }
}
</style>

        x: W * Math.random(), y: H * Math.random(), vx: 0, vy: 0, c: i % 2
      }));
      const nd = Math.round(Math.min(160, Math.max(50, (W * H) / 12000)));
      dust = Array.from({ length: nd }, () => ({ x: Math.random() * W, y: Math.random() * H, z: 0.2 + Math.random() * 0.8, ph: Math.random() * 6.28 }));
    } else if (mode === 'warp') {
      const n = Math.round(Math.min(420, Math.max(150, (W * H) / 5500)));
      stars = Array.from({ length: n }, () => newStar(true));
    } else {
      const n = Math.round(Math.min(700, Math.max(240, (W * H) / 2600)));
      flow = Array.from({ length: n }, newFlow);
    }
  }

  function resize() {
    const nw = innerWidth, nh = innerHeight;
    DPR = Math.min(devicePixelRatio || 1, 1.5);
    const changed = nw !== W || Math.abs(nh - H) > 150;
    W = nw; H = nh;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!mouse.on) { mouse.sx = W / 2; mouse.sy = H / 2; }
    if (vp.x === 0) { vp.x = W / 2; vp.y = H / 2; }
    if (changed || (!blobs.length && !stars.length && !flow.length)) initMode();
  }

  function stepPulses(dt) {
    for (let i = pulses.length - 1; i >= 0; i--) {
      pulses[i].age += dt;
      if (pulses[i].age > 1.6) pulses.splice(i, 1);
    }
  }

  function drawAurora(dt) {
    const k = dt * 60 * S;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const R0 = Math.max(W, H);
    for (const b of blobs) {
      const tx = W * (b.cx + Math.sin(t * b.sp * S + b.ph) * b.ax);
      const ty = H * (b.cy + Math.cos(t * b.sp * S * 1.3 + b.ph) * b.ay);
      b.vx += (tx - b.x) * 0.0022 * k; b.vy += (ty - b.y) * 0.0022 * k;
      if (mouse.on) { b.vx += (mouse.sx - b.x) * 0.00035 * k; b.vy += (mouse.sy - b.y) * 0.00035 * k; }
      for (const pl of pulses) {
        const dx = b.x - pl.x, dy = b.y - pl.y, d = Math.hypot(dx, dy) || 1;
        const diff = Math.abs(d - pl.age * 460);
        if (diff < 90) {
          const f = (1 - diff / 90) * (1 - pl.age / 1.6) * 1.6 * k;
          b.vx += (dx / d) * f; b.vy += (dy / d) * f;
        }
      }
      const damp = Math.pow(0.94, k);
      b.vx *= damp; b.vy *= damp;
      b.x += b.vx * k; b.y += b.vy * k;
      const R = b.r * R0 * 0.85, col = b.c ? rgb2 : rgb;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, R);
      g.addColorStop(0, 'rgba(' + col + ',.15)');
      g.addColorStop(0.5, 'rgba(' + col + ',.045)');
      g.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = g;
      ctx.fillRect(b.x - R, b.y - R, R * 2, R * 2);
    }
    const ox = (mouse.sx - W / 2) * -0.03, oy = (mouse.sy - H / 2) * -0.03;
    ctx.fillStyle = 'rgb(' + rgb + ')';
    for (const d of dust) {
      const tw = 0.5 + 0.5 * Math.sin(t * 1.2 * S + d.ph);
      const x = (((d.x + ox * d.z) % W) + W) % W, y = (((d.y + oy * d.z) % H) + H) % H;
      ctx.globalAlpha = (0.12 + 0.4 * d.z) * tw;
      ctx.fillRect(x, y, d.z * 1.7, d.z * 1.7);
    }
    ctx.globalAlpha = 1;
    if (mouse.on) { trail.push({ x: mouse.sx, y: mouse.sy }); if (trail.length > 26) trail.shift(); }
    else if (trail.length) trail.shift();
    for (let i = 0; i < trail.length; i++) {
      const f = (i + 1) / trail.length;
      ctx.fillStyle = 'rgba(' + rgb2 + ',' + (f * 0.16).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, 3 + f * 9, 0, 6.2832); ctx.fill();
    }
    if (mouse.on) {
      const g = ctx.createRadialGradient(mouse.sx, mouse.sy, 0, mouse.sx, mouse.sy, 190);
      g.addColorStop(0, 'rgba(' + rgb + ',.17)');
      g.addColorStop(1, 'rgba(' + rgb + ',0)');
      ctx.fillStyle = g;
      ctx.fillRect(mouse.sx - 190, mouse.sy - 190, 380, 380);
    }
    ctx.lineWidth = 1.4;
    for (const pl of pulses) {
      ctx.strokeStyle = 'rgba(' + rgb2 + ',' + ((1 - pl.age / 1.6) * 0.5).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.age * 460, 0, 6.2832); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawWarp(dt) {
    ctx.clearRect(0, 0, W, H);
    warpBoost = Math.max(0, warpBoost - dt * 0.7);
    const tx = mouse.on ? W / 2 + (mouse.sx - W / 2) * 0.4 : W / 2;
    const ty = mouse.on ? H / 2 + (mouse.sy - H / 2) * 0.4 : H / 2;
    const e = Math.min(1, dt * 3);
    vp.x += (tx - vp.x) * e; vp.y += (ty - vp.y) * e;
    const f = Math.max(W, H) * 0.35;
    const speed = (0.22 + warpBoost * 1.6) * dt * S;
    const tail = 0.025 + warpBoost * 0.09;
    const gr = Math.max(W, H) * 0.45;
    const g = ctx.createRadialGradient(vp.x, vp.y, 0, vp.x, vp.y, gr);
    g.addColorStop(0, 'rgba(' + rgb + ',.07)');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round';
    for (const s of stars) {
      s.z -= speed;
      if (s.z <= 0.03) { Object.assign(s, newStar(false)); continue; }
      const pz = s.z + tail;
      const px = vp.x + (s.x / s.z) * f, py = vp.y + (s.y / s.z) * f;
      if (px < -60 || px > W + 60 || py < -60 || py > H + 60) { Object.assign(s, newStar(false)); continue; }
      const qx = vp.x + (s.x / pz) * f, qy = vp.y + (s.y / pz) * f;
      const depth = 1 - s.z;
      ctx.strokeStyle = 'rgba(' + (s.c ? rgb2 : rgb) + ',' + Math.min(1, depth * 1.1).toFixed(2) + ')';
      ctx.lineWidth = 0.4 + depth * 2.2;
      ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(px, py); ctx.stroke();
    }
  }

  function drawFlow(dt) {
    const k = dt * 60 * S;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,.06)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineWidth = 1.1; ctx.lineCap = 'round';
    const paths = [new Path2D(), new Path2D()];
    for (const p of flow) {
      const a = Math.sin(p.x * 0.0021 + t * 0.12 * S) * 2.2 + Math.cos(p.y * 0.0027 - t * 0.1 * S) * 2.2 + Math.sin((p.x + p.y) * 0.0013 + t * 0.07 * S) * 1.5;
      let vx = Math.cos(a) * 1.2, vy = Math.sin(a) * 1.2;
      if (mouse.on) {
        const dx = p.x - mouse.sx, dy = p.y - mouse.sy, d = Math.hypot(dx, dy) || 1;
        if (d < 240) {
          const f = 1 - d / 240;
          vx += (-dy / d) * f * 3.2 - (dx / d) * f * 0.7;
          vy += (dx / d) * f * 3.2 - (dy / d) * f * 0.7;
        }
      }
      for (const pl of pulses) {
        const dx = p.x - pl.x, dy = p.y - pl.y, d = Math.hypot(dx, dy) || 1;
        const diff = Math.abs(d - pl.age * 460);
        if (diff < 70) {
          const f = (1 - diff / 70) * (1 - pl.age / 1.6) * 5;
          vx += (dx / d) * f; vy += (dy / d) * f;
        }
      }
      p.px = p.x; p.py = p.y;
      p.x += vx * k; p.y += vy * k; p.life -= k;
      if (p.life <= 0 || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) { Object.assign(p, newFlow()); continue; }
      const pa = paths[p.c];
      pa.moveTo(p.px, p.py); pa.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = 'rgba(' + rgb + ',.42)'; ctx.stroke(paths[0]);
    ctx.strokeStyle = 'rgba(' + rgb2 + ',.4)'; ctx.stroke(paths[1]);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; t += dt;
    if (mouse.on) {
      const e = Math.min(1, dt * 10);
      mouse.sx += (mouse.x - mouse.sx) * e; mouse.sy += (mouse.y - mouse.sy) * e;
    }
    stepPulses(dt);
    if (mode === 'aurora') drawAurora(dt);
    else if (mode === 'warp') drawWarp(dt);
    else drawFlow(dt);
    requestAnimationFrame(frame);
  }

  function setMode(m) {
    if (!MODES.includes(m)) return false;
    mode = m; store.set('mode', m);
    $('#bgName').textContent = m;
    initMode();
    addPulse(W / 2, H / 2);
    return true;
  }

  document.addEventListener('pointermove', (e) => {
    if (!mouse.on) { mouse.sx = e.clientX; mouse.sy = e.clientY; }
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true;
  });
  document.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') setTimeout(() => { mouse.on = false; }, 500); });
  document.addEventListener('pointercancel', () => { mouse.on = false; });
  root.addEventListener('pointerleave', () => { mouse.on = false; });
  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('#term, #game')) return;
    addPulse(e.clientX, e.clientY);
  });
  $('#bgBtn').addEventListener('click', () => setMode(MODES[(MODES.indexOf(mode) + 1) % MODES.length]));
  $('#bgName').textContent = mode;
  let rz;
  addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(resize); });
  resize();
  requestAnimationFrame(frame);

  /* ---------- terminal ---------- */
  const term = $('#term'), out = $('#out'), form = $('#form'), inp = $('#in'), openBtn = $('#openTerm');
  const UH = CFG.handle.toLowerCase();
  // SHA-256 of 'emirbbjoe-salt:' + password. Log in, then type: passwd <new password> to get a new one to paste here.
  const ADMIN_HASH = '67dad29bb3e2f75eabe5f3fdc20015d3ee13b45d5b6d1bfb26b0f407abaa2401';
  let authed = false, pwMode = false, fails = 0, lockUntil = 0;
  let PS1 = 'visitor@' + UH + ':~$';
  $('#ps1').textContent = PS1;
  function setUser(root) {
    authed = root;
    PS1 = (root ? 'root@' : 'visitor@') + UH + (root ? ':~#' : ':~$');
    $('#ps1').textContent = PS1;
  }
  async function sha(t) {
    if (!(window.crypto && crypto.subtle)) throw new Error('no crypto');
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('emirbbjoe-salt:' + t));
    return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, '0')).join('');
  }
  function endPw() { pwMode = false; inp.type = 'text'; inp.value = ''; $('#ps1').textContent = PS1; }
  async function tryLogin(pw) {
    endPw();
    if (Date.now() < lockUntil) { add('too many attempts. wait ' + Math.ceil((lockUntil - Date.now()) / 1000) + 's.', 'err'); return; }
    let ok = false;
    try { ok = (await sha(pw)) === ADMIN_HASH; }
    catch (e) { add('login needs https (secure context).', 'err'); return; }
    if (ok) { fails = 0; setUser(true); add('welcome back, ' + CFG.name + '. root access granted.', 'ok'); add("try 'sudo help'.", 'dim'); }
    else {
      fails++;
      if (fails >= 5) { lockUntil = Date.now() + 30000; fails = 0; }
      setTimeout(() => add('login incorrect.', 'err'), 600);
    }
  }
  const history = [];
  let hIdx = 0, booted = false;
  const t0 = Date.now();

  const FILES = {
    'about.txt': () => CFG.bio,
    'links.txt': () => CFG.links.map((l) => l.id.padEnd(10) + ' ' + (safeUrl(l.url) || ('@' + (l.copy || '')))),
    'readme.md': () => ['# ' + CFG.name, '', "type 'help' for commands.", "try 'bg warp', 'theme amber' or 'pulse'."]
  };
  const ARGS = {
    theme: () => Object.keys(THEMES),
    bg: () => MODES,
    cat: () => Object.keys(FILES),
    open: () => CFG.links.map((l) => l.id)
  };

  function scrollEnd() { out.scrollTop = out.scrollHeight; }
  function add(text, cls) {
    const d = document.createElement('div');
    d.className = 'l' + (cls ? ' ' + cls : '');
    d.textContent = text;
    out.appendChild(d); scrollEnd();
    return d;
  }
  function addLink(prefix, label, url) {
    const d = document.createElement('div');

    const a = document.createElement('a');

  function echoCmd(raw) {

  }

  const HELP = [
    ['help', 'list commands'],
    ['about', 'who is this'],

    ['id', 'show the id card'],
    ['links', 'list social links'],

    ['sudo <cmd>', 'root only · sudo help'],

  ];

  const cmds = {
    help() {
      add('commands', 'ok');
      HELP.forEach(([k, d]) => add('  ' + k.padEnd(16) + d, 'dim'));
      add('tip: Tab completes, ↑ ↓ browse history, Ctrl+L clears.', 'dim');
    },

      });
    },
    open(a) {
      if (!a[0]) { add('usage: open <name>  (' + CFG.links.map((l) => l.id).join(', ') + ')', 'err'); return; }
      const l = CFG.links.find((x) => x.id === a[0].toLowerCase());
      if (!l) { add('unknown link: ' + a[0], 'err'); return; }
      const url = safeUrl(l.url);
      if (!url) { add(l.id + ': @' + (l.copy || '') + '  (use the bubble on the page to copy it)', 'dim'); return; }
      addLink('opening ', url + ' ↗', url);
      add('(click the link if a new tab did not open)', 'dim');
      try { window.open(url, '_blank', 'noopener,noreferrer'); } catch (e) { /* link above works */ }
    },

    cat(a) {

    },

    },
    pulse() { addPulse(W / 2, H / 2); add('pulse sent.', 'ok'); },
    glitch() { scramble(titleEl, TITLE, 1200); add('title scrambled.', 'ok'); },

    sudo(a) {

      const sub = (a[0] || 'help').toLowerCase();
      if (sub === 'help') {
        add('root commands', 'ok');
        [['sudo whoami', 'who am i'], ['sudo status', 'live discord / steam state'], ['sudo panic', 'shockwave storm'],
         ['sudo reboot', 'restart the shell'], ['sudo rm -rf /', 'do not']].forEach(([k, d]) => add('  ' + k.padEnd(16) + d, 'dim'));
      } else if (sub === 'whoami') add('root');

  function run(raw) {
    const [c, ...a] = raw.trim().split(/\s+/);

    else add('command not found: ' + c + " — try 'help'", 'err');

  function complete() {
    const parts = inp.value.split(/\s+/);
    const last = parts[parts.length - 1].toLowerCase();
    let pool;
    if (parts.length === 1) pool = Object.keys(cmds);
    else { const g = Object.prototype.hasOwnProperty.call(ARGS, parts[0].toLowerCase()) ? ARGS[parts[0].toLowerCase()] : null; pool = g ? g() : []; }
    const m = pool.filter((x) => x.startsWith(last));
    if (!m.length) return;
    if (m.length === 1) { parts[parts.length - 1] = m[0]; inp.value = parts.join(' ') + ' '; return; }
    let pre = m[0];
    for (const s of m) while (!s.startsWith(pre)) pre = pre.slice(0, -1);
    parts[parts.length - 1] = pre;
    inp.value = parts.join(' ');
    add(m.join('   '), 'dim');
  }

    const raw = inp.value.trim();
    inp.value = '';
    if (!raw) return;
    echoCmd(raw);
    if (history[history.length - 1] !== raw) history.push(raw);
    hIdx = history.length;
    run(raw);
  });

  inp.addEventListener('keydown', (e) => {
    if (pwMode && (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Tab')) { e.preventDefault(); return; }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (hIdx > 0) { hIdx--; inp.value = history[hIdx]; }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (hIdx < history.length - 1) { hIdx++; inp.value = history[hIdx]; }
      else { hIdx = history.length; inp.value = ''; }
    } else if (e.key === 'Tab') {
      e.preventDefault(); complete();
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault(); cmds.clear();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (game.open) { gameKey(e); return; }
    if (e.key === 'Escape' && !term.hidden) { closeTerm(); return; }
    if (e.key === '`' || e.code === 'Backquote') {
      const tg = e.target;
      const typing = tg && tg.matches && tg.matches('input, textarea') && tg !== inp;
      if (typing) return;
      e.preventDefault();
      if (term.hidden) openTerm(); else closeTerm();
    }
  });

  /* ---------- minigame: snake (walls wrap around, only your own tail hurts) ---------- */
  const gameEl = $('#game'), gCv = $('#gCv'), gctx = gCv.getContext('2d');
  const gScoreEl = $('#gScore'), gBestEl = $('#gBest');
  const GN = 20;
  const game = { open: false };
  let snake = [], gDir = { x: 1, y: 0 }, gQueue = [], gFood = { x: 0, y: 0 };
  let gPoints = 0, gBestN = parseInt(store.get('snakeBest') || '0', 10) || 0, gNewBest = false;
  let gState = 'ready', gAcc = 0, gLast = 0, gRaf = 0, gSize = 0, gDpr = 1;

  function gHud() { gScoreEl.textContent = gPoints; gBestEl.textContent = Math.max(gBestN, gPoints); }
  function gPlaceFood() {
    let p;
    do { p = { x: (Math.random() * GN) | 0, y: (Math.random() * GN) | 0 }; }
    while (snake.some((s) => s.x === p.x && s.y === p.y));
    gFood = p;
  }
  function gReset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    gDir = { x: 1, y: 0 }; gQueue = []; gPoints = 0; gAcc = 0; gNewBest = false; gState = 'ready';
    gPlaceFood(); gHud();
  }
  function gStart() { if (gState === 'ready' || gState === 'paused') gState = 'playing'; }
  function gRestart() { gReset(); gState = 'playing'; }
  function gOver() {
    gState = 'over';
    if (gPoints > gBestN) { gBestN = gPoints; gNewBest = true; store.set('snakeBest', String(gBestN)); }
    gHud();
  }
  function gSetDir(dx, dy) {
    if (gState === 'over') return;
    const last = gQueue.length ? gQueue[gQueue.length - 1] : gDir;
    if (dx === -last.x && dy === -last.y) return;
    if (!(dx === last.x && dy === last.y) && gQueue.length < 2) gQueue.push({ x: dx, y: dy });
    gStart();
  }
  function gStep() {
    if (gQueue.length) gDir = gQueue.shift();
    const hx = (snake[0].x + gDir.x + GN) % GN, hy = (snake[0].y + gDir.y + GN) % GN;
    const eating = hx === gFood.x && hy === gFood.y;
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some((s) => s.x === hx && s.y === hy)) { gOver(); return; }
    snake.unshift({ x: hx, y: hy });
    if (eating) {
      gPoints++;
      if (snake.length >= GN * GN) { gOver(); return; }
      gPlaceFood(); gHud();
    } else snake.pop();
  }

  function gRR(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function gMsg(title, sub, sub2) {
    const g = gctx;
    g.fillStyle = 'rgba(3,4,6,.74)'; g.fillRect(0, 0, gSize, gSize);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#fff';
    g.font = '500 ' + Math.round(gSize * 0.075) + 'px "Martian Mono", ui-monospace, monospace';
    g.fillText(title, gSize / 2, gSize * 0.42);
    g.fillStyle = 'rgba(255,255,255,.62)';
    g.font = '400 ' + Math.round(gSize * 0.036) + 'px "Martian Mono", ui-monospace, monospace';
    g.fillText(sub, gSize / 2, gSize * 0.52);
    if (sub2) g.fillText(sub2, gSize / 2, gSize * 0.58);
  }
  function gDraw(now) {
    const g = gctx, c = gSize / GN;
    g.setTransform(gDpr, 0, 0, gDpr, 0, 0);
    g.clearRect(0, 0, gSize, gSize);
    g.fillStyle = 'rgba(255,255,255,.07)';
    for (let y = 0; y < GN; y++) for (let x = 0; x < GN; x++) g.fillRect(x * c + c / 2 - 1, y * c + c / 2 - 1, 2, 2);
    const pulse = 0.5 + 0.5 * Math.sin(now / 220);
    const fx = gFood.x * c + c / 2, fy = gFood.y * c + c / 2;
    g.fillStyle = 'rgba(' + accRgb + ',' + (0.14 + 0.12 * pulse).toFixed(3) + ')';
    g.beginPath(); g.arc(fx, fy, c * (0.62 + 0.1 * pulse), 0, 6.2832); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(fx, fy, c * 0.26, 0, 6.2832); g.fill();
    const L = snake.length;
    for (let i = L - 1; i >= 0; i--) {
      const sg = snake[i], k = 1 - i / L;
      g.fillStyle = i === 0 ? '#fff' : 'rgba(' + accRgb + ',' + (0.28 + 0.62 * k).toFixed(3) + ')';
      gRR(g, sg.x * c + 1.5, sg.y * c + 1.5, c - 3, c - 3, c * 0.3);
      g.fill();
    }
    if (gState === 'ready') gMsg('SNAKE', 'swipe or use arrow keys', 'to start');
    else if (gState === 'paused') gMsg('PAUSED', 'space or tap to resume');
    else if (gState === 'over') gMsg(gNewBest ? 'NEW BEST' : 'GAME OVER', 'score ' + gPoints + ' · best ' + gBestN, 'tap or press space');
  }
  function gLoop(now) {
    if (!game.open) return;
    const dt = Math.min(100, now - gLast);
    gLast = now;
    if (gState === 'playing') {
      gAcc += dt;
      const stepMs = Math.max(62, 125 - gPoints * 2);
      while (gAcc >= stepMs && gState === 'playing') { gAcc -= stepMs; gStep(); }
    }
    gDraw(now);
    gRaf = requestAnimationFrame(gLoop);
  }
  function gSizeCanvas() {
    gSize = gCv.clientWidth || 360;
    gDpr = Math.min(devicePixelRatio || 1, 2);
    gCv.width = gCv.height = Math.round(gSize * gDpr);
  }
  function openGame() {
    if (game.open) return;
    game.open = true;
    inp.blur();
    gameEl.hidden = false;
    gSizeCanvas(); gReset();
    gLast = performance.now();
    gRaf = requestAnimationFrame(gLoop);
  }
  function closeGame() {
    if (!game.open) return;
    game.open = false;
    cancelAnimationFrame(gRaf);
    gameEl.hidden = true;
    if (!term.hidden) inp.focus();
  }
  const G_KEYS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
  };
  function gameKey(e) {
    const k = e.key;
    if (k === 'Escape') { e.preventDefault(); closeGame(); return; }
    if (Object.prototype.hasOwnProperty.call(G_KEYS, k)) {
      e.preventDefault();
      gSetDir(G_KEYS[k][0], G_KEYS[k][1]);
      return;
    }
    if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P') {
      e.preventDefault();
      if (gState === 'over') gRestart();
      else if (gState === 'playing') gState = 'paused';
      else gStart();
      return;
    }
    if ((k === 'r' || k === 'R' || k === 'Enter') && gState === 'over') { e.preventDefault(); gRestart(); }
  }
  let gSwipe = null;
  gCv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (gState === 'over') { gRestart(); return; }
    gStart();
    gSwipe = { x: e.clientX, y: e.clientY };
    try { gCv.setPointerCapture(e.pointerId); } catch (err) { /* not supported */ }
  });
  gCv.addEventListener('pointermove', (e) => {
    if (!gSwipe) return;
    const dx = e.clientX - gSwipe.x, dy = e.clientY - gSwipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) gSetDir(dx > 0 ? 1 : -1, 0);
    else gSetDir(0, dy > 0 ? 1 : -1);
    gSwipe = { x: e.clientX, y: e.clientY };
  });
  const gEndSwipe = () => { gSwipe = null; };
  gCv.addEventListener('pointerup', gEndSwipe);
  gCv.addEventListener('pointercancel', gEndSwipe);
  const G_PAD = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  $('#dpad').addEventListener('pointerdown', (e) => {
    const b = e.target.closest && e.target.closest('button[data-d]');
    if (!b || !Object.prototype.hasOwnProperty.call(G_PAD, b.dataset.d)) return;
    e.preventDefault();
    if (gState === 'over') { gRestart(); return; }
    gSetDir(G_PAD[b.dataset.d][0], G_PAD[b.dataset.d][1]);
  });
  $('#gX').addEventListener('click', closeGame);
  addEventListener('resize', () => { if (game.open) gSizeCanvas(); });
  document.addEventListener('visibilitychange', () => { if (game.open && document.hidden && gState === 'playing') gState = 'paused'; });
  gHud();

  /* drag the terminal by its title bar */
  const termH = $('#termH');
  let drag = null, tx = 0, ty = 0;
  termH.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    drag = { x: e.clientX - tx, y: e.clientY - ty };
    termH.setPointerCapture(e.pointerId);
  });
  termH.addEventListener('pointermove', (e) => {
    if (!drag) return;
    tx = e.clientX - drag.x; ty = e.clientY - drag.y;
    term.style.setProperty('--tx', tx + 'px');
    term.style.setProperty('--ty', ty + 'px');
  });
  const endDrag = () => { drag = null; };
  termH.addEventListener('pointerup', endDrag);
  termH.addEventListener('pointercancel', endDrag);
})();
</script>
</body>
</html>
